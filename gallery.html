<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Poster gallery | Dolphin School</title>
<meta name="description" content="Every weekly poster from dlphn.app, newest first." />
<meta name="theme-color" content="#111a2e" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://dlphn.app/gallery" />
<meta property="og:title" content="Poster gallery | Dolphin School" />
<meta property="og:description" content="Every weekly poster from dlphn.app, newest first." />
<meta property="og:image" content="https://dlphn.app/social-image.png" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="/src/site.css" />
</head>
<body class="gallery-page">

<header class="top">
  <div class="brand">
    <a class="wordmark" href="/">Dolphin School</a>
  </div>
  <div class="top-right">
    <a class="text-link" href="/"><span data-icon="arrowLeft"></span>This week</a>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Open menu"><span data-icon="list"></span></button>
  </div>
</header>

<main class="gallery-wrap">
  <div class="gallery-head">
    <h1>Poster gallery</h1>
    <span class="count" id="posterCount"></span>
  </div>
  <div class="gallery-grid" id="galleryGrid"></div>
</main>

<dialog class="lightbox" id="lightbox" aria-label="Poster">
  <div class="lightbox-inner">
    <div class="lightbox-bar">
      <span class="caption" id="lightboxCaption"></span>
      <button class="icon-btn" id="lightboxClose" type="button" aria-label="Close"><span data-icon="x"></span></button>
    </div>
    <div class="lightbox-stage"><img id="lightboxImg" alt="" /></div>
    <div class="lightbox-nav">
      <button class="icon-btn" id="lightboxPrev" type="button" aria-label="Previous poster"><span data-icon="arrowLeft"></span></button>
      <button class="icon-btn flip" id="lightboxNext" type="button" aria-label="Next poster"><span data-icon="arrowLeft"></span></button>
    </div>
  </div>
</dialog>

<script>
// ── Poster archive: add the newest poster at the top ──
const posters = [
  { src:'/thisweek/image_2026-08-31.jpg?v=1', week:'Week A, back to school', dates:'31 Aug-6 Sep 2026' },
  { src:'/thisweek/image_2026-07-06.jpg', week:'Week A, last week of term', dates:'6-12 July 2026' },
  { src:'/thisweek/image_2026-06-29.jpg', week:'Week B', dates:'29 June-5 July 2026' },
  { src:'/thisweek/image_2026-06-15.jpg', week:'Week B', dates:'15-21 June 2026' },
  { src:'/thisweek/image_2026-06-09.jpg?v=6', week:'Week A', dates:'8-14 June 2026' },
  { src:'/thisweek/image_2026-06-01.jpg', week:'Half Term (Day 9)', dates:'1-7 June 2026' },
  { src:'/thisweek/image_2026-05-25.jpg', week:'Half Term', dates:'25-31 May 2026' },
  { src:'/thisweek/image_2026-05-25_v1.jpg', week:'Half Term (v1)', dates:'25-31 May 2026' },
  { src:'/thisweek/image_2026-05-18.jpg', week:'Week A', dates:'18-24 May 2026' },
  { src:'/thisweek/image_2026-05-11.jpg', week:'Week B', dates:'11-17 May 2026' }
];
window.posters = posters;
</script>
<script type="module">
import { initGallery } from '/src/gallery.js';
initGallery(window.posters);
</script>

</body>
</html>
