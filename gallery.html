<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>dlphn.app — Weekly Poster Gallery</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@font-face{font-family:'Inter';font-style:normal;font-weight:400;src:url(https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiA.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;src:url(https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuGKYAZ9hiA.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
body{
  margin:0;padding:0;background:#0a0a1a;color:#fff;font-family:'Inter',-apple-system,sans-serif;
  min-height:100vh;
}

/* ── HEADER ── */
header{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;
  background:linear-gradient(180deg,#1a1a3e 0%,#0f0f2a 100%);
  border-bottom:1px solid rgba(255,255,255,0.08);
}
header .school{display:flex;flex-direction:column;gap:1px}
header .school h1{font-size:16px;font-weight:600;letter-spacing:0.3px;color:#e8e0ff}
header .school span{font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:0.2px}
header .badge{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.25);
  border-radius:10px;padding:6px 14px;
}
header .badge .week{font-size:18px;font-weight:600;color:#ffd700;line-height:1}
header .badge .dates{font-size:10px;color:rgba(255,215,0,0.6);letter-spacing:0.3px}

/* ── GALLERY GRID ── */
.gallery-wrap{
  padding:24px;
  max-width:1200px;
  margin:0 auto;
}
.gallery-title{
  font-size:14px;
  font-weight:600;
  color:rgba(255,255,255,0.5);
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:16px;
}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:20px;
}
.gallery-item{
  background:linear-gradient(180deg,#12122e 0%,#1a1a3e 100%);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:transform 0.15s ease, border-color 0.15s ease;
}
.gallery-item:hover{
  transform:translateY(-2px);
  border-color:rgba(255,215,0,0.2);
}
.gallery-item img{
  display:block;
  width:100%;
  aspect-ratio:1 / 1;
  object-fit:cover;
  background:#0a0a1a;
}
.gallery-item .meta{
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.gallery-item .meta .week{font-size:13px;font-weight:600;color:#e8e0ff}
.gallery-item .meta .dates{font-size:11px;color:rgba(255,255,255,0.4)}

/* ── LIGHTBOX ── */
.lightbox{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,0.92);
  display:none;align-items:center;justify-content:center;
  padding:24px;
}
.lightbox.open{display:flex}
.lightbox img{
  max-width:100%;max-height:85vh;
  border-radius:8px;
  object-fit:contain;
}
.lightbox .close{
  position:absolute;top:16px;right:20px;
  font-size:28px;color:rgba(255,255,255,0.6);
  cursor:pointer;line-height:1;
}
.lightbox .close:hover{color:#fff}
.lightbox .caption{
  position:absolute;bottom:16px;left:0;right:0;
  text-align:center;font-size:13px;
  color:rgba(255,255,255,0.5);
}

/* ── NAV PANEL (reused) ── */
.nav-panel{
  position:fixed;top:0;right:-260px;width:260px;height:100vh;
  background:linear-gradient(180deg,#1a1a3e 0%,#0f0f2a 100%);
  border-left:1px solid rgba(255,255,255,0.06);
  z-index:50;transition:right 0.25s ease;
  display:flex;flex-direction:column;
}
.nav-panel.open{right:0}
.nav-header{padding:20px 20px 12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-header .brand{font-size:16px;font-weight:600;color:#ffd700;letter-spacing:0.5px}
.nav-header .tagline{font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px}
.nav-links{list-style:none;padding:8px 0;margin:0}
.nav-links li{padding:0}
.nav-links a{
  display:flex;align-items:center;gap:10px;
  padding:10px 20px;font-size:14px;color:rgba(255,255,255,0.7);
  text-decoration:none;transition:background 0.15s;
}
.nav-links a:hover{background:rgba(255,255,255,0.04);color:#fff}
.nav-links .link-icon{font-size:16px;width:20px;text-align:center}
.nav-links .link-arrow{color:rgba(255,255,255,0.2);margin-left:auto;font-size:11px}
.nav-toggle{
  position:fixed;top:50%;right:0;transform:translateY(-50%);
  width:32px;height:48px;
  background:linear-gradient(180deg,#1a1a3e 0%,#0f0f2a 100%);
  border:1px solid rgba(255,255,255,0.08);border-right:none;
  border-radius:8px 0 0 8px;
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,0.5);font-size:14px;cursor:pointer;z-index:40;
  transition:right 0.25s ease;
}
.nav-panel.open ~ .nav-toggle{right:260px}

/* ── MOBILE ── */
@media (max-width:640px){
  .gallery-grid{grid-template-columns:1fr}
  .gallery-wrap{padding:16px}
  header{padding:12px 16px}
  .nav-panel{width:200px}
  .nav-panel.open ~ .nav-toggle{right:200px}
}
</style>
</head>
<body>

<header>
  <div class="school">
    <h1>Dolphin School</h1>
    <span>Weekly Poster Archive</span>
  </div>
  <div class="badge">
    <span class="week">Gallery</span>
    <span class="dates">Past Weeks</span>
  </div>
</header>

<div class="gallery-wrap">
  <div class="gallery-title">Past weekly posters</div>
  <div class="gallery-grid" id="galleryGrid">
    <!-- Items populated below -->
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="close" id="lightboxClose">×</div>
  <img id="lightboxImg" src="" alt="" />
  <div class="caption" id="lightboxCaption"></div>
</div>

<!-- Floating Nav -->
<div class="nav-panel" id="navPanel">
  <div class="nav-header">
    <div class="brand">dlphn.app</div>
    <div class="tagline">project hub</div>
  </div>
  <ul class="nav-links">
    <li><a href="/"><span class="link-icon">📅</span> This Week <span class="link-arrow">→</span></a></li>
    <li><a href="/reception"><span class="link-icon">🌸</span> Reception <span class="link-arrow">→</span></a></li>
    <li><a href="/card"><span class="link-icon">💳</span> Card <span class="link-arrow">→</span></a></li>
    <li><a href="/games"><span class="link-icon">🎮</span> Games <span class="link-arrow">→</span></a></li>
    <li><a href="/horrid"><span class="link-icon">💀</span> Horrid <span class="link-arrow">→</span></a></li>
    <li><a href="/is-it-swimming-today"><span class="link-icon">🏊</span> Swimming <span class="link-arrow">→</span></a></li>
    <li><a href="/kids-vs-parents"><span class="link-icon">👨‍👩‍👧‍👦</span> Kids vs Parents <span class="link-arrow">→</span></a></li>
    <li><a href="/ideas"><span class="link-icon">💡</span> Ideas <span class="link-arrow">→</span></a></li>
  </ul>
</div>

<div class="nav-toggle" id="navToggle">◀</div>

<script>
const posters = [
  { src:'/thisweek/image_2026-05-18.jpg', week:'Week A', dates:'18–24 May 2026' },
  { src:'/thisweek/image_2026-05-11.jpg', week:'Week B', dates:'11–17 May 2026' },
];

const grid = document.getElementById('galleryGrid');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxCaption = document.getElementById('lightboxCaption');
const lightboxClose = document.getElementById('lightboxClose');

posters.forEach(p => {
  const el = document.createElement('div');
  el.className = 'gallery-item';
  el.innerHTML = `
    <img src="${p.src}" alt="${p.week}" loading="lazy" />
    <div class="meta">
      <div class="week">${p.week}</div>
      <div class="dates">${p.dates}</div>
    </div>
  `;
  el.addEventListener('click', () => {
    lightboxImg.src = p.src;
    lightboxCaption.textContent = `${p.week} — ${p.dates}`;
    lightbox.classList.add('open');
  });
  grid.appendChild(el);
});

lightboxClose.addEventListener('click', () => lightbox.classList.remove('open'));
lightbox.addEventListener('click', e => { if(e.target === lightbox) lightbox.classList.remove('open'); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') lightbox.classList.remove('open'); });

// Nav toggle
const navPanel = document.getElementById('navPanel');
const navToggle = document.getElementById('navToggle');
let navOpen = false;
navToggle.addEventListener('click', () => {
  navOpen = !navOpen;
  navPanel.classList.toggle('open', navOpen);
  navToggle.textContent = navOpen ? '▶' : '◀';
});
document.addEventListener('click', e => {
  if(navOpen && !navPanel.contains(e.target) && e.target !== navToggle){
    navOpen = false; navPanel.classList.remove('open'); navToggle.textContent = '◀';
  }
});
</script>

</body>
</html>
