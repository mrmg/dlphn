<svg xmlns="http://www.w3.org/2000/svg" width="48" height="32" viewBox="0 0 48 32">
  <rect width="48" height="32" fill="#ffffff"/>
  <!-- Red cross -->
  <rect x="0" y="12" width="48" height="8" fill="#cf142b"/>
  <rect x="20" y="0" width="8" height="32" fill="#cf142b"/>
  <!-- Six-pointed star (simplified) -->
  <g transform="translate(24,16)">
    <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#ffffff" stroke="#cf142b" stroke-width="1"/>
    <!-- Red hand (simplified) -->
    <rect x="-1.5" y="-3" width="3" height="6" fill="#cf142b"/>
    <rect x="-3" y="-1.5" width="6" height="3" fill="#cf142b"/>
    <!-- Crown (very simplified) -->
    <g transform="translate(0,-10)">
      <rect x="-4" y="0" width="8" height="2" fill="#f4c430"/>
      <polygon points="-3,0 -1,-3 0,-1 1,-3 3,0" fill="#f4c430"/>
    </g>
  </g>
</svg>

