<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Is It Swimming Today?</title>
  <style>
    :root {
      --yes-color: #0b2a5b;
      --no-color: #6b1010;
      --text-color: #1f2937;
      --muted-color: #4b5563;
      --background: #f9fafb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 3.25rem;
      background: var(--background);
      color: var(--text-color);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .answer {
      font-size: clamp(4rem, 18vw, 11rem);
      line-height: 1;
      margin: 0;
      letter-spacing: 0.08em;
    }

    .details {
      margin-top: 0.35rem;
      font-size: clamp(0.95rem, 2.2vw, 1.2rem);
      color: var(--muted-color);
      max-width: 44rem;
    }

    .kit-list {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 0.55rem 0.75rem;
      font-size: clamp(0.7rem, 1.6vw, 0.85rem);
      color: var(--muted-color);
      background: rgba(249, 250, 251, 0.92);
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="answer" id="answer">NO</h1>
    <p class="details" id="details">Working it out...</p>
  </main>

  <footer class="kit-list">Bring: navy swimming costume/shorts • crocs • towel • swim hat • goggles</footer>

  <script>
    const DAY_MS = 24 * 60 * 60 * 1000;

    // Ref: Mon 9 Feb 2026 = Week A (matches school dashboard).
    const WEEK_A_START = new Date(2026, 1, 9);
    const HALF_TERM_START = new Date(2026, 4, 23); // May 23
    const HALF_TERM_END = new Date(2026, 5, 2);    // June 2

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function differenceInDays(start, end) {
      const startUtc = Date.UTC(start.getFullYear(), start.getMonth(), start.getDate());
      const endUtc = Date.UTC(end.getFullYear(), end.getMonth(), end.getDate());
      return Math.floor((endUtc - startUtc) / DAY_MS);
    }

    function mondayOf(date) {
      const monday = startOfDay(date);
      const day = monday.getDay();
      monday.setDate(monday.getDate() - day + (day === 0 ? -6 : 1));
      return monday;
    }

    function isHalfTerm(date) {
      const today = startOfDay(date);
      return today >= HALF_TERM_START && today <= HALF_TERM_END;
    }

    function isWeekA(date) {
      const monday = mondayOf(date);
      let weekIndex = Math.floor(differenceInDays(WEEK_A_START, monday) / 7);

      // Half term doesn't advance the A/B cycle — undo the extra flip after term resumes.
      if (monday > HALF_TERM_END) {
        weekIndex -= 1;
      }

      return weekIndex % 2 === 0;
    }

    function swimmingDayForWeek(date) {
      // JS getDay(): 0 Sun, 1 Mon, 2 Tue, 3 Wed, 4 Thu...
      return isWeekA(date) ? 4 : 2;
    }

    function nextSwimmingDates(fromDate) {
      const cursor = startOfDay(fromDate);
      const found = [];

      while (found.length < 2) {
        if (cursor.getDay() === swimmingDayForWeek(cursor)) {
          found.push(new Date(cursor));
        }
        cursor.setDate(cursor.getDate() + 1);
      }

      return found;
    }

    function dayWithOrdinal(day) {
      const mod10 = day % 10;
      const mod100 = day % 100;
      if (mod10 === 1 && mod100 !== 11) return `${day}st`;
      if (mod10 === 2 && mod100 !== 12) return `${day}nd`;
      if (mod10 === 3 && mod100 !== 13) return `${day}rd`;
      return `${day}th`;
    }

    function formatDateWithOrdinal(date) {
      const weekday = date.toLocaleDateString('en-GB', { weekday: 'long' });
      const month = date.toLocaleDateString('en-GB', { month: 'long' });
      const year = date.getFullYear();
      const day = dayWithOrdinal(date.getDate());
      return `${weekday} ${day} ${month} ${year}`;
    }

    function relativePrefix(fromDate, targetDate) {
      const days = differenceInDays(startOfDay(fromDate), startOfDay(targetDate));
      if (days === 0) return 'today';
      if (days === 1) return 'tomorrow';
      return `in ${days} days`;
    }

    function relativeWithDate(fromDate, targetDate) {
      const relative = relativePrefix(fromDate, targetDate);
      const connector = relative === 'tomorrow' ? ',' : ', on';
      return `${relative}${connector} ${formatDateWithOrdinal(targetDate)}`;
    }

    function render() {
      const today = startOfDay(new Date());
      const answer = document.getElementById('answer');
      const details = document.getElementById('details');

      if (isHalfTerm(today)) {
        answer.textContent = 'NO';
        answer.style.color = 'var(--no-color)';
        details.textContent = 'Half term — no swimming.';
        return;
      }

      const [nextDate, followingDate] = nextSwimmingDates(today);
      const isTodaySwimming = differenceInDays(today, nextDate) === 0;

      if (isTodaySwimming) {
        answer.textContent = 'YES';
        answer.style.color = 'var(--yes-color)';
        details.textContent = `The one after is ${relativeWithDate(today, followingDate)}.`;
      } else {
        answer.textContent = 'NO';
        answer.style.color = 'var(--no-color)';
        details.textContent = `Next swimming is ${relativeWithDate(today, nextDate)}.`;
      }
    }

    render();
  </script>
</body>
</html>
