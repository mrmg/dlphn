<script>
// ── Year 4 weekly data: edit this block each week ──
// weekLabel: a single letter renders as "Week A"; any other text (for example 'Half Term') is shown as written.
// Each day: name, date, month (short), weather (emoji), temp, activities (plain strings, coloured by CHIP_RULES).
// Source of truth for kit/days/events: ObsidianVault/School/ (Days.md, Year 4/, Reception/, Calendar.md)
// Updated from vault 2 Sep 2026. Term began Thu 3 Sep 2026, Week A from Mon 31 Aug.
const WEEK_DATA = {
  year: 2026,
  startMonth: 8,
  startDay: 31,
  weekLabel: 'A',
  days: [
    { name:'Mon', date:31, month:'Aug', weather:'🌦', temp:'22°', activities:['Bank Holiday']},
    { name:'Tue', date:1, month:'Sep', weather:'☁️', temp:'21°', activities:[]},
    { name:'Wed', date:2, month:'Sep', weather:'🌦', temp:'20°', activities:['Inset Day']},
    { name:'Thu', date:3, month:'Sep', weather:'☁️', temp:'25°', activities:['Term Begins','PE']},
    { name:'Fri', date:4, month:'Sep', weather:'🌦', temp:'21°', activities:['PE Kit','Welcome Back Event']},
    { name:'Sat', date:5, month:'Sep', weather:'☁️', temp:'21°', activities:[]},
    { name:'Sun', date:6, month:'Sep', weather:'☁️', temp:'26°', activities:[]}
  ]
};

// Chip colours for Year 4 activities: the first matching rule wins.
// Classes: chip-kit (green), chip-school (blue), chip-kids (orange), chip-parents (violet), chip-birthday (rose).
const CHIP_RULES = [
  { test: /Birthday/i, cls: 'chip-birthday' },
  { test: /Bank Holiday|Inset|Term Begins|Welcome Back|Meet The Teacher|Parents.? Evening|Flu|Trip|Sports Day|House Colours|Packed Lunch/i, cls: 'chip-school' },
  { test: /Dance|Swim|PE Kit|Games/i, cls: 'chip-kit' },
  { test: /\bPE\b|Physical Education/i, cls: 'chip-kit' },
  { test: /All Stars|Cricket|Party/i, cls: 'chip-kids' },
  { test: /Mum|Dad|Parent|Forest School|PYJAMARAMA|Discover Dolphin|Digital Detox|Dolphin Forum/i, cls: 'chip-parents' }
];

// ── Reception timetable by fortnight (shown at /?reception or /#reception) ──
// WEEK_A_START is a Monday that was a Week A. Weeks alternate A/B from there.
// 2026–27 (SchoolBase 2 Sep): PE Mon + Thu (no set kit); Forest School Friday every week. Music/French not confirmed.
// Classes: chip-forest (green), chip-pe (blue), chip-music (violet), chip-french (rose), chip-event (orange), chip-school (blue).
const WEEK_A_START = new Date(2026, 7, 31); // Mon 31 Aug 2026 = Week A
const RECEPTION_TIMETABLE = {
  A: {
    mon: [{ label:'PE', cls:'chip-pe' }],
    tue: [],
    wed: [],
    thu: [{ label:'PE', cls:'chip-pe' }],
    fri: [{ label:'Forest School', cls:'chip-forest' }]
  },
  B: {
    mon: [{ label:'PE', cls:'chip-pe' }],
    tue: [],
    wed: [],
    thu: [{ label:'PE', cls:'chip-pe' }],
    fri: [{ label:'Forest School', cls:'chip-forest' }]
  }
};

// One-off day replacements for Reception (date ISO → chips). When set, replaces the recurring timetable for that date.
// Keep empty most weeks; fill from School/Calendar.md + Reception/Events.md.
const RECEPTION_DAY_OVERRIDES = {
  '2026-08-31': [{ label:'Bank Holiday', cls:'chip-school' }],
  '2026-09-01': [],
  '2026-09-02': [{ label:'Inset Day', cls:'chip-school' }],
  '2026-09-03': [{ label:'Term Begins', cls:'chip-school' }, { label:'PE', cls:'chip-pe' }],
  '2026-09-04': [{ label:'Forest School', cls:'chip-forest' }, { label:'Welcome Back Event', cls:'chip-school' }]
};

// ── Reception poster ──
// Reception has its own poster. Set to { src:'/reception/image_YYYY-MM-DD.jpg', alt:'...' } when one exists;
// null shows a "No Reception poster yet" panel. The <img id="zoomImg"> above stays the Year 4 poster.
const RECEPTION_POSTER = null;

window.WEEK_DATA = WEEK_DATA;
window.CHIP_RULES = CHIP_RULES;
window.RECEPTION_POSTER = RECEPTION_POSTER;
window.WEEK_A_START = WEEK_A_START;
window.RECEPTION_TIMETABLE = RECEPTION_TIMETABLE;
window.RECEPTION_DAY_OVERRIDES = RECEPTION_DAY_OVERRIDES;
</script>

</body>
