<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>This week | Dolphin School</title>
<meta name="description" content="What's on this week at Dolphin School for Year 4 and Reception: kit days, swimming, clubs and the weekly poster." />
<meta name="theme-color" content="#111a2e" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://dlphn.app/" />
<meta property="og:title" content="This week | Dolphin School" />
<meta property="og:description" content="What's on this week at Dolphin School for Year 4 and Reception: kit days, swimming, clubs and the weekly poster." />
<meta property="og:image" content="https://dlphn.app/social-image.png" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="/src/site.css" />
</head>
<body class="week-page" data-year="year4">

<header class="top">
  <div class="brand">
    <a class="wordmark" href="/">Dolphin School</a>
    <details class="year-menu" id="yearMenu">
      <summary aria-label="Change year group, currently Year 4"><span>Year 4</span><span data-icon="caretDown"></span></summary>
      <ul>
        <li><a href="/" data-view="year4" aria-current="page">Year 4</a></li>
        <li><a href="/?reception" data-view="reception">Reception</a></li>
      </ul>
    </details>
  </div>
  <div class="top-right">
    <div class="week-badge">
      <span class="week" id="weekBadge">Week A</span>
      <span class="dates" id="dateRange">6-12 July 2026</span>
    </div>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Open menu"><span data-icon="list"></span></button>
  </div>
</header>

<main class="poster" id="poster">
  <div class="poster-bg" aria-hidden="true"></div>
  <div class="zoom-wrap" id="zoomWrap">
    <img id="zoomImg" src="/thisweek/image_2026-07-06.jpg?v=2" alt="This week's poster for Dolphin School" fetchpriority="high" />
  </div>
  <a href="/gallery" class="icon-btn poster-action" aria-label="Poster gallery"><span data-icon="images"></span></a>
</main>

<div class="strips" id="dayStrip"></div>

<script>
// ── Year 4 weekly data: edit this block each week ──
// weekLabel: a single letter renders as "Week A"; any other text (for example 'Half Term') is shown as written.
// Each day: name, date, month (short), weather (emoji), temp, activities (plain strings, coloured by CHIP_RULES).
const WEEK_DATA = {
  year: 2026,
  startMonth: 7,
  startDay: 6,
  weekLabel: 'A',
  days: [
    { name:'Mon', date:6, month:'Jul', weather:'☁️', temp:'32°', activities:['Dance']},
    { name:'Tue', date:7, month:'Jul', weather:'☁️', temp:'31°', activities:['Sports Day — Year 3','Packed Lunch','House Colours']},
    { name:'Wed', date:8, month:'Jul', weather:'☀️', temp:'31°', activities:['PE Kit']},
    { name:'Thu', date:9, month:'Jul', weather:'🌤️', temp:'32°', activities:['Swimming']},
    { name:'Fri', date:10, month:'Jul', weather:'🌦', temp:'34°', activities:['Last Day of School','Finish 12:20','End of Term Party 12:30','All Stars Cricket']},
    { name:'Sat', date:11, month:'Jul', weather:'🌦', temp:'33°', activities:[]},
    { name:'Sun', date:12, month:'Jul', weather:'🌦', temp:'28°', activities:[]}
  ]
};

// Chip colours for Year 4 activities: the first matching rule wins.
// Classes: chip-kit (green), chip-school (blue), chip-kids (orange), chip-parents (violet), chip-birthday (rose).
const CHIP_RULES = [
  { test: /Birthday/i, cls: 'chip-birthday' },
  { test: /Mum Cinema|Eurovision|James|Summer Fair|Careers|Performance/i, cls: 'chip-school' },
  { test: /Dance|Swim|PE Kit/i, cls: 'chip-kit' },
  { test: /All Stars|Cricket|Party/i, cls: 'chip-kids' },
  { test: /Mum|Dad|Parent|PYJAMARAMA|Discover Dolphin|Digital Detox|Dolphin Forum|East Sussex|Trip|Forest School/i, cls: 'chip-parents' }
];

// ── Reception timetable by fortnight (shown at /?reception or /#reception) ──
// WEEK_A_START is a Monday that was a Week A. Weeks alternate A/B from there.
// Classes: chip-forest (green), chip-pe (blue), chip-music (violet), chip-french (rose), chip-event (orange).
const WEEK_A_START = new Date(2026, 1, 9);
const RECEPTION_TIMETABLE = {
  A: {
    mon: [{ label:'Forest School', cls:'chip-forest' }],
    tue: [{ label:'Music', cls:'chip-music' }],
    wed: [{ label:'Forest School', cls:'chip-forest' }],
    thu: [{ label:'PE', cls:'chip-pe' }, { label:'French', cls:'chip-french' }],
    fri: [{ label:'Forest School', cls:'chip-forest' }, { label:'French', cls:'chip-french' }]
  },
  B: {
    mon: [{ label:'PE', cls:'chip-pe' }],
    tue: [{ label:'Music', cls:'chip-music' }],
    wed: [{ label:'Forest School', cls:'chip-forest' }],
    thu: [{ label:'PE', cls:'chip-pe' }],
    fri: [{ label:'Forest School', cls:'chip-forest' }, { label:'French', cls:'chip-french' }]
  }
};

window.WEEK_DATA = WEEK_DATA;
window.CHIP_RULES = CHIP_RULES;
window.WEEK_A_START = WEEK_A_START;
window.RECEPTION_TIMETABLE = RECEPTION_TIMETABLE;
</script>
<script type="module">
import { initWeekPage } from '/src/site.js';
initWeekPage({
  data: window.WEEK_DATA,
  rules: window.CHIP_RULES,
  timetable: window.RECEPTION_TIMETABLE,
  weekAStart: window.WEEK_A_START
});
</script>

</body>
</html>
