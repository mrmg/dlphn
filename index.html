<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dolphin School — This Week</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@font-face{font-family:'Inter';font-style:normal;font-weight:400;src:url(https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiA.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;src:url(https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuGKYAZ9hiA.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
body{
  margin:0;padding:0;background:#0a0a1a;color:#fff;font-family:'Inter',-apple-system,sans-serif;
  width:100vw;height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;
}

/* ── HEADER ── */
header{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;
  background:linear-gradient(180deg,#1a1a3e 0%,#0f0f2a 100%);
  border-bottom:1px solid rgba(255,255,255,0.08);
  flex-shrink:0;
}
header .school{display:flex;flex-direction:column;gap:1px}
header .school h1{font-size:16px;font-weight:600;letter-spacing:0.3px;color:#e8e0ff}
header .school span{font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:0.2px}
header .badge{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.25);
  border-radius:10px;padding:6px 14px;
}
header .badge .week{font-size:18px;font-weight:600;color:#ffd700;line-height:1}
header .badge .dates{font-size:10px;color:rgba(255,215,0,0.6);letter-spacing:0.3px}

/* ── IMAGE ── */
.image-area{
  flex:1;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  min-height:0;
}
.image-area img{
  width:100%;height:100%;object-fit:cover;
  display:block;
}

/* ── 7-DAY STRIP ── */
.day-strip{
  flex-shrink:0;
  display:flex;
  background:linear-gradient(0deg,#12122e 0%,#1a1a3e 100%);
  border-top:1px solid rgba(255,255,255,0.06);
  padding:0;
  min-height:145px;
}
.day{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:14px 6px 10px;gap:4px;
  border-right:1px solid rgba(255,255,255,0.04);
  position:relative;
}
.day:last-child{border-right:none}
.day.today{background:rgba(255,215,0,0.06)}
.day.weekend .day-name,.day.weekend .day-date,.day.weekend .weather,.day.weekend .temp{opacity:0.35}
.day .day-name{font-size:12px;font-weight:600;text-transform:uppercase;color:rgba(255,255,255,0.5);letter-spacing:0.5px}
.day .day-date{font-size:11px;color:rgba(255,255,255,0.3)}
.day.today .day-name{color:#ffd700}
.day .weather-temp{display:flex;flex-direction:column;align-items:center;line-height:1}
.day .weather{font-size:20px;line-height:1}
.day .temp{font-size:13px;color:rgba(255,255,255,0.5);line-height:1}
.day .chips{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:4px;width:100%}
.day .chip{
  display:inline-block;padding:4px 10px;border-radius:12px;
  font-size:11px;font-weight:600;line-height:1.3;white-space:nowrap;
}
.day .chip-kit{background:rgba(74,222,128,0.15);color:#4ade80}
.day .chip-school{background:rgba(96,165,250,0.15);color:#60a5fa}
.day .chip-kids{background:rgba(251,146,60,0.15);color:#fb923c}
.day .chip-parents{background:rgba(192,132,252,0.15);color:#c084fc}
.day .chip-birthday{background:rgba(251,113,133,0.15);color:#fb7185}
.day .chip-default{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7)}

/* ── FLOATING NAV ── */
.nav-toggle{
  position:fixed;top:50%;right:0;z-index:1000;
  transform:translateY(-50%);
  width:28px;height:52px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(26,26,62,0.9);border:1px solid rgba(255,255,255,0.1);
  border-right:none;border-radius:8px 0 0 8px;
  cursor:pointer;transition:right 0.3s cubic-bezier(0.4,0,0.2,1);
  color:rgba(255,255,255,0.5);font-size:14px;
}
.nav-toggle:hover{color:#ffd700;background:rgba(26,26,62,1)}
.nav-toggle.open{right:220px}

.nav-panel{
  position:fixed;top:0;right:-220px;z-index:999;
  width:220px;height:100vh;
  background:#0f0f2a;border-left:1px solid rgba(255,255,255,0.08);
  display:flex;flex-direction:column;
  transition:right 0.3s cubic-bezier(0.4,0,0.2,1);
  overflow-y:auto;
}
.nav-panel.open{right:0}

.nav-header{
  padding:20px 16px 12px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.nav-header .brand{font-size:13px;font-weight:600;color:#e8e0ff;letter-spacing:0.3px}
.nav-header .tagline{font-size:10px;color:rgba(255,255,255,0.35);margin-top:2px}

.nav-links{list-style:none;padding:8px 0;margin:0}
.nav-links li{padding:0}
.nav-links a{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;color:rgba(255,255,255,0.6);
  text-decoration:none;font-size:13px;font-weight:400;
  border-left:2px solid transparent;
  transition:all 0.15s;
}
.nav-links a:hover{
  background:rgba(255,255,255,0.04);color:#fff;
  border-left-color:#ffd700;
}
.nav-links .link-icon{font-size:16px;width:20px;text-align:center}
.nav-links .link-arrow{color:rgba(255,255,255,0.2);margin-left:auto;font-size:11px}

@media(max-width:640px){
  header{padding:10px 14px}
  header .school h1{font-size:13px}
  .day-strip{
    display:flex;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x mandatory;
    padding:8px 8px 16px 8px;
  }
  .day{
    flex:0 0 95px;
    padding:10px 4px 8px;
    border-right:1px solid rgba(255,255,255,0.04);
    scroll-snap-align:start;
  }
  .day:last-child{border-right:none}
  .day .day-name{font-size:11px}
  .day .day-date{font-size:10px}
  .day .weather{font-size:16px}
  .day .weather-temp{display:flex;align-items:center;gap:4px}
  .day .temp{font-size:11px}
  .day .chips{flex-direction:column;gap:5px;width:100%}
  .day .chip{font-size:10px;padding:3px 8px;white-space:normal;word-break:break-word;text-align:center}
  .nav-panel{width:200px}
  .nav-panel.open ~ .nav-toggle{right:200px}
}
</style>
</head>
<body>

<header>
  <div class="school">
    <h1>Dolphin School</h1>
    <span>Wokingham, Berkshire</span>
  </div>
  <div class="badge">
    <span class="week" id="weekBadge">Week B</span>
    <span class="dates" id="dateRange">11–17 May 2026</span>
  </div>
</header>

<div class="image-area">
  <img src="/thisweek/image_2026-05-11.jpg" alt="This week at Dolphin School" />
</div>

<div class="day-strip" id="dayStrip">
  <!-- filled by JS -->
</div>

<!-- Floating Nav -->
<div class="nav-panel" id="navPanel">
  <div class="nav-header">
    <div class="brand">dlphn.app</div>
    <div class="tagline">project hub</div>
  </div>
  <ul class="nav-links">
    <li><a href="/card"><span class="link-icon">💳</span> Card <span class="link-arrow">→</span></a></li>
    <li><a href="/games"><span class="link-icon">🎮</span> Games <span class="link-arrow">→</span></a></li>
    <li><a href="/horrid"><span class="link-icon">💀</span> Horrid <span class="link-arrow">→</span></a></li>
    <li><a href="/is-it-swimming-today"><span class="link-icon">🏊</span> Swimming <span class="link-arrow">→</span></a></li>
    <li><a href="/kids-vs-parents"><span class="link-icon">👨‍👩‍👧‍👦</span> Kids vs Parents <span class="link-arrow">→</span></a></li>
    <li><a href="/ideas"><span class="link-icon">💡</span> Ideas <span class="link-arrow">→</span></a></li>
  </ul>
</div>

<div class="nav-toggle" id="navToggle">◀</div>

<script>
// ── Week data ──
// Edit this block each week via cron:
const WEEK_DATA = {
  year: 2026,
  startMonth: 5,  // 1-indexed
  startDay: 11,
  weekLabel: 'B',
  days: [
    { name:'Mon', date:11, weather:'🌦', temp:'10°', activities:['Dance']},
    { name:'Tue', date:12, weather:'⛅', temp:'15°', activities:['Swimming']},
    { name:'Wed', date:13, weather:'🌦', temp:'12°', activities:['PE Kit']},
    { name:'Thu', date:14, weather:'⛅', temp:'13°', activities:['Mum Cinema']},
    { name:'Fri', date:15, weather:'☁️', temp:'8°', activities:['PE Kit','All Stars Cricket','Dolphin Forum']},
    { name:'Sat', date:16, weather:'', temp:'', activities:["Gus's Birthday Party",'Eurovision Party']},
    { name:'Sun', date:17, weather:'', temp:'', activities:[]}
  ]
};

// ── Build strip ──
const strip = document.getElementById('dayStrip');
const today = new Date();
const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
const weekStart = new Date(WEEK_DATA.year, WEEK_DATA.startMonth-1, WEEK_DATA.startDay);

WEEK_DATA.days.forEach((d, i) => {
  const dayDate = new Date(WEEK_DATA.year, WEEK_DATA.startMonth-1, d.date);
  const isToday = `${WEEK_DATA.year}-${String(WEEK_DATA.startMonth).padStart(2,'0')}-${String(d.date).padStart(2,'0')}` === todayStr;
  const isWeekend = i >= 5;

  const el = document.createElement('div');
  el.className = 'day' + (isToday ? ' today' : '') + (isWeekend ? ' weekend' : '');

  el.innerHTML = `
    <div class="day-name">${d.name}</div>
    <div class="day-date">${d.date} May</div>
    ${d.weather || d.temp ? `<div class="weather-temp">${d.weather ? `<span class="weather">${d.weather}</span>` : ''}${d.temp ? `<span class="temp">${d.temp}</span>` : ''}</div>` : ''}
    ${d.activities && d.activities.length ? `<div class="chips">${d.activities.map(a => {
      let cls = 'chip-default';
      if (/Birthday/i.test(a)) cls = 'chip-birthday';
      else if (/Mum Cinema|Eurovision/i.test(a)) cls = 'chip-parents';
      else if (/Dance|Swim|PE Kit/i.test(a)) cls = 'chip-kit';
      else if (/Dolphin Forum|East Sussex|Trip/i.test(a)) cls = 'chip-school';
      else if (/All Stars|Cricket|Party/i.test(a)) cls = 'chip-kids';
      return `<span class="chip ${cls}">${a}</span>`;
    }).join('')}</div>` : ''}
  `;
  strip.appendChild(el);
});

// ── Week badge ──
document.getElementById('weekBadge').textContent = 'Week ' + WEEK_DATA.weekLabel;

// ── Nav toggle ──
const toggle = document.getElementById('navToggle');
const panel = document.getElementById('navPanel');

toggle.addEventListener('click', () => {
  const isOpen = panel.classList.toggle('open');
  toggle.classList.toggle('open');
  toggle.textContent = isOpen ? '▶' : '◀';
});

// Close nav when clicking outside
document.addEventListener('click', (e) => {
  if (panel.classList.contains('open') &&
      !panel.contains(e.target) &&
      !toggle.contains(e.target)) {
    panel.classList.remove('open');
    toggle.classList.remove('open');
    toggle.textContent = '◀';
  }
});
</script>

</body>
</html>
