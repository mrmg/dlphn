<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dolphin School — This Week</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@font-face{font-family:'Inter';font-style:normal;font-weight:400;src:url(https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiA.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;src:url(https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuGKYAZ9hiA.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
body{
  margin:0;padding:0;background:#0a0a1a;color:#fff;font-family:'Inter',-apple-system,sans-serif;
  width:100vw;height:100vh;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;
}

/* ── HEADER ── */
header{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;
  background:linear-gradient(180deg,#1a1a3e 0%,#0f0f2a 100%);
  border-bottom:1px solid rgba(255,255,255,0.08);
  flex-shrink:0;
}
header .school{display:flex;flex-direction:column;gap:1px}
header .school h1{font-size:16px;font-weight:600;letter-spacing:0.3px;color:#e8e0ff}
header .school span{font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:0.2px}
header .badge{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.25);
  border-radius:10px;padding:6px 14px;
}
header .badge .week{font-size:18px;font-weight:600;color:#ffd700;line-height:1}
header .badge .dates{font-size:10px;color:rgba(255,215,0,0.6);letter-spacing:0.3px}

/* ── IMAGE ── */
.image-area{
  flex:1;position:relative;overflow:hidden;
  min-height:0;
}
.image-area .zoom-wrap{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.image-area .zoom-wrap img{
  display:block;max-width:none;max-height:none;
  object-fit:none;
  transform-origin:0 0;
}
.image-area .gallery-link{
  position:absolute;top:10px;right:10px;z-index:5;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.3);
  border-radius:8px;
  text-decoration:none;
  font-size:20px;
  filter:grayscale(1);
  opacity:0.5;
  transition:opacity 0.15s, background 0.15s;
}
.image-area .gallery-link:hover{opacity:0.9; background:rgba(0,0,0,0.5);}

/* ── 7-DAY STRIP ── */
.day-strip{
  flex-shrink:0;
  display:flex;
  background:linear-gradient(0deg,#12122e 0%,#1a1a3e 100%);
  border-top:1px solid rgba(255,255,255,0.06);
  padding:0;
  min-height:145px;
}
.day{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:14px 6px 10px;gap:4px;
  border-right:1px solid rgba(255,255,255,0.04);
  position:relative;
}
.day:last-child{border-right:none}
.day.today{background:rgba(255,215,0,0.06)}
.day.weekend .day-name,.day.weekend .day-date,.day.weekend .weather,.day.weekend .temp{opacity:0.35}
.day .day-name{font-size:12px;font-weight:600;text-transform:uppercase;color:rgba(255,255,255,0.5);letter-spacing:0.5px}
.day .day-date{font-size:11px;color:rgba(255,255,255,0.3)}
.day.today .day-name{color:#ffd700}
.day .weather-temp{display:flex;flex-direction:column;align-items:center;line-height:1}
.day .weather{font-size:20px;line-height:1}
.day .temp{font-size:13px;color:rgba(255,255,255,0.5);line-height:1}
.day .chips{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:4px;width:100%}
.day .chip{
  display:inline-block;padding:4px 10px;border-radius:12px;
  font-size:11px;font-weight:600;line-height:1.3;white-space:nowrap;
}
.day .chip-kit{background:rgba(74,222,128,0.15);color:#4ade80}
.day .chip-school{background:rgba(96,165,250,0.15);color:#60a5fa}
.day .chip-kids{background:rgba(251,146,60,0.15);color:#fb923c}
.day .chip-parents{background:rgba(192,132,252,0.15);color:#c084fc}
.day .chip-birthday{background:rgba(251,113,133,0.15);color:#fb7185}
.day .chip-default{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7)}

/* ── FLOATING NAV ── */
.nav-toggle{
  position:fixed;top:50%;right:0;z-index:1000;
  transform:translateY(-50%);
  width:28px;height:52px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(26,26,62,0.9);border:1px solid rgba(255,255,255,0.1);
  border-right:none;border-radius:8px 0 0 8px;
  cursor:pointer;transition:right 0.3s cubic-bezier(0.4,0,0.2,1);
  color:rgba(255,255,255,0.5);font-size:14px;
}
.nav-toggle:hover{color:#ffd700;background:rgba(26,26,62,1)}
.nav-toggle.open{right:220px}

.nav-panel{
  position:fixed;top:0;right:-220px;z-index:999;
  width:220px;height:100vh;
  background:#0f0f2a;border-left:1px solid rgba(255,255,255,0.08);
  display:flex;flex-direction:column;
  transition:right 0.3s cubic-bezier(0.4,0,0.2,1);
  overflow-y:auto;
}
.nav-panel.open{right:0}

.nav-header{
  padding:20px 16px 12px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.nav-header .brand{font-size:13px;font-weight:600;color:#e8e0ff;letter-spacing:0.3px}
.nav-header .tagline{font-size:10px;color:rgba(255,255,255,0.35);margin-top:2px}

.nav-links{list-style:none;padding:8px 0;margin:0}
.nav-links li{padding:0}
.nav-links a{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;color:rgba(255,255,255,0.6);
  text-decoration:none;font-size:13px;font-weight:400;
  border-left:2px solid transparent;
  transition:all 0.15s;
}
.nav-links a:hover{
  background:rgba(255,255,255,0.04);color:#fff;
  border-left-color:#ffd700;
}
.nav-links .link-icon{font-size:16px;width:20px;text-align:center}
.nav-links .link-arrow{color:rgba(255,255,255,0.2);margin-left:auto;font-size:11px}

/* ── YEAR SWITCH ── */
.year-switch{
  position:fixed;top:12px;right:100px;z-index:20;
  display:none;gap:6px;
}
.year-switch a{
  display:inline-block;padding:4px 12px;border-radius:8px;
  font-size:11px;font-weight:600;text-decoration:none;
  transition:all 0.15s;
}
.year-switch a.y3{
  background:rgba(255,215,0,0.12);color:#ffd700;
  border:1px solid rgba(255,215,0,0.25);
}
.year-switch a.y3:hover{background:rgba(255,215,0,0.2)}
.year-switch a.rec{
  background:rgba(80,200,120,0.12);color:#50c878;
  border:1px solid rgba(80,200,120,0.25);
}
.year-switch a.rec:hover{background:rgba(80,200,120,0.2)}
.year-switch a.active{opacity:1;pointer-events:none}
.year-switch a:not(.active){opacity:0.5}
.year-switch a:not(.active):hover{opacity:0.8}

@media(max-width:640px){
  .year-switch{top:auto;bottom:8px;right:14px;left:14px;justify-content:center;z-index:999}
  .year-switch a{padding:6px 16px;font-size:12px}
  header{padding:10px 14px}
  header .school h1{font-size:13px}
  .day-strip{
    flex-shrink:0;
    display:flex;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x mandatory;
    padding:8px 8px 16px 8px;
    min-height:auto;
    background:linear-gradient(0deg,#12122e 0%,#1a1a3e 100%);
    border-top:1px solid rgba(255,255,255,0.06);
  }
  .day{
    flex:0 0 95px;
    padding:10px 4px 8px;
    border-right:1px solid rgba(255,255,255,0.04);
    scroll-snap-align:start;
  }
  .day:last-child{border-right:none}
  .day .day-name{font-size:11px}
  .day .day-date{font-size:10px}
  .day .weather{font-size:16px}
  .day .weather-temp{display:flex;align-items:center;gap:4px}
  .day .temp{font-size:11px}
  .day .chips{flex-direction:column;gap:5px;width:100%}
  .day .chip{font-size:10px;padding:3px 8px;white-space:normal;word-break:break-word;text-align:center}
  .nav-panel{width:200px}
  .nav-panel.open ~ .nav-toggle{right:200px}
}
</style>
</head>
<body>

<!-- Year Switch -->
<div class="year-switch">
  <a href="/" class="y3 active">Year 3</a>
  <a href="/reception" class="rec">Reception</a>
</div>

<header>
  <div class="school">
    <h1>Dolphin School</h1>
    <span>Wokingham, Berkshire</span>
  </div>
  <div class="badge">
    <span class="week" id="weekBadge">Week A</span>
    <span class="dates" id="dateRange">18–24 May 2026</span>
  </div>
</header>

<div class="image-area">
  <div class="zoom-wrap" id="zoomWrap">
    <img id="zoomImg" src="/thisweek/image_2026-05-25.jpg" alt="This week at Dolphin School" />
  </div>
  <a href="/gallery" class="gallery-link" title="Gallery">🖼️</a>
</div>

<div class="day-strip" id="dayStrip">
  <!-- filled by JS -->
</div>

<!-- Floating Nav -->
<div class="nav-panel" id="navPanel">
  <div class="nav-header">
    <div class="brand">dlphn.app</div>
    <div class="tagline">project hub</div>
  </div>
  <ul class="nav-links">
    <li><a href="/card"><span class="link-icon">💳</span> Card <span class="link-arrow">→</span></a></li>
    <li><a href="/games"><span class="link-icon">🎮</span> Games <span class="link-arrow">→</span></a></li>
    <li><a href="/horrid"><span class="link-icon">💀</span> Horrid <span class="link-arrow">→</span></a></li>
    <li><a href="/is-it-swimming-today"><span class="link-icon">🏊</span> Swimming <span class="link-arrow">→</span></a></li>
    <li><a href="/kids-vs-parents"><span class="link-icon">👨‍👩‍👧‍👦</span> Kids vs Parents <span class="link-arrow">→</span></a></li>
    <li><a href="/ideas"><span class="link-icon">💡</span> Ideas <span class="link-arrow">→</span></a></li>
  </ul>
</div>

<div class="nav-toggle" id="navToggle">◀</div>

<script>
// ── Week data ──
// Edit this block each week via cron:
const WEEK_DATA = {
  year: 2026,
  startMonth: 5,
  startDay: 25,
  weekLabel: 'A',
  days: [
    { name:'Mon', date:25, weather:'☀️', temp:'33°', activities:['Half Term']},
    { name:'Tue', date:26, weather:'☀️', temp:'33°', activities:['Half Term']},
    { name:'Wed', date:27, weather:'⛅', temp:'27°', activities:['Half Term']},
    { name:'Thu', date:28, weather:'☁️', temp:'30°', activities:['Half Term']},
    { name:'Fri', date:29, weather:'☁️', temp:'32°', activities:['Half Term','All Stars Cricket']},
    { name:'Sat', date:30, weather:'🌦', temp:'27°', activities:[]},
    { name:'Sun', date:31, weather:'☁️', temp:'23°', activities:[]}
  ]
};

// ── Build strip ──
const strip = document.getElementById('dayStrip');
const today = new Date();
const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
const weekStart = new Date(WEEK_DATA.year, WEEK_DATA.startMonth-1, WEEK_DATA.startDay);

WEEK_DATA.days.forEach((d, i) => {
  const dayDate = new Date(WEEK_DATA.year, WEEK_DATA.startMonth-1, d.date);
  const isToday = `${WEEK_DATA.year}-${String(WEEK_DATA.startMonth).padStart(2,'0')}-${String(d.date).padStart(2,'0')}` === todayStr;
  const isWeekend = i >= 5;

  const el = document.createElement('div');
  el.className = 'day' + (isToday ? ' today' : '') + (isWeekend ? ' weekend' : '');

  el.innerHTML = `
    <div class="day-name">${d.name}</div>
    <div class="day-date">${d.date} May</div>
    ${d.weather || d.temp ? `<div class="weather-temp">${d.weather ? `<span class="weather">${d.weather}</span>` : ''}${d.temp ? `<span class="temp">${d.temp}</span>` : ''}</div>` : ''}
    ${d.activities && d.activities.length ? `<div class="chips">${d.activities.map(a => {
      let cls = 'chip-default';
      if (/Birthday/i.test(a)) cls = 'chip-birthday';
      else if (/Mum Cinema|Eurovision/i.test(a)) cls = 'chip-parents';
      else if (/Dance|Swim|PE Kit/i.test(a)) cls = 'chip-kit';
      else if (/Dolphin Forum|East Sussex|Trip|Forest School/i.test(a)) cls = 'chip-school';
      else if (/All Stars|Cricket|Party/i.test(a)) cls = 'chip-kids';
      return `<span class="chip ${cls}">${a}</span>`;
    }).join('')}</div>` : ''}
  `;
  strip.appendChild(el);
});

// ── Half term handling ──
const HALF_TERM_START = new Date(2026, 4, 23); // May 23
const HALF_TERM_END = new Date(2026, 5, 2);    // June 2

function isHalfTerm() {
  const today = new Date();
  return today >= HALF_TERM_START && today <= HALF_TERM_END;
}

// ── Week badge ──
if (isHalfTerm()) {
  document.getElementById('weekBadge').textContent = 'Half Term';
} else {
  document.getElementById('weekBadge').textContent = 'Week ' + WEEK_DATA.weekLabel;
}

// ── Nav toggle ──
const toggle = document.getElementById('navToggle');
const panel = document.getElementById('navPanel');

toggle.addEventListener('click', () => {
  const isOpen = panel.classList.toggle('open');
  toggle.classList.toggle('open');
  toggle.textContent = isOpen ? '▶' : '◀';
});

// Close nav when clicking outside
document.addEventListener('click', (e) => {
  if (panel.classList.contains('open') &&
      !panel.contains(e.target) &&
      !toggle.contains(e.target)) {
    panel.classList.remove('open');
    toggle.classList.remove('open');
    toggle.textContent = '◀';
  }
});

// ── Image pinch-to-zoom + pan ──
(function() {
  const img = document.getElementById('zoomImg');
  const wrap = document.getElementById('zoomWrap');
  if (!img || !wrap) return;

  let scale, tx, ty, coverScale;
  let lastDist = 0;
  let startX, startY;
  let imgW, imgH;

  function init() {
    const cw = wrap.clientWidth;
    const ch = wrap.clientHeight;
    if (!cw || !ch) { setTimeout(init, 50); return; }
    imgW = img.naturalWidth || cw;
    imgH = img.naturalHeight || ch;
    coverScale = Math.max(cw / imgW, ch / imgH);
    reset();
  }

  function apply() {
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  function clamp() {
    const cw = wrap.clientWidth;
    const ch = wrap.clientHeight;
    const sw = imgW * scale;
    const sh = imgH * scale;
    // Flex centers the img's natural-size CSS box at (cw-imgW)/2
    const flexX = (cw - imgW) / 2;
    const flexY = (wrap.clientHeight - imgH) / 2;
    // Constrain visual edges so image doesn't scroll fully off
    const visMinX = Math.min(0, cw - sw);
    const visMaxX = Math.max(0, cw - sw);
    const visMinY = Math.min(0, ch - sh);
    const visMaxY = Math.max(0, ch - sh);
    tx = Math.max(visMinX - flexX, Math.min(visMaxX - flexX, tx));
    ty = Math.max(visMinY - flexY, Math.min(visMaxY - flexY, ty));
  }

  function reset() {
    const cw = wrap.clientWidth;
    const ch = wrap.clientHeight;
    scale = coverScale;
    tx = imgW * (1 - scale) / 2;
    ty = imgH * (1 - scale) / 2;
    apply();
  }

  img.onload = init;
  if (img.complete && img.naturalWidth) init();
  window.addEventListener('resize', reset);

  // Touch handlers
  wrap.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const t = e.touches;
      lastDist = Math.hypot(t[1].clientX - t[0].clientX, t[1].clientY - t[0].clientY);
    } else if (e.touches.length === 1) {
      const cw = wrap.clientWidth;
      const ch = wrap.clientHeight;
      const sw = imgW * scale;
      const sh = imgH * scale;
      if (sw > cw || sh > ch) {
        startX = e.touches[0].clientX - tx;
        startY = e.touches[0].clientY - ty;
      }
    }
  }, { passive: false });

  wrap.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const t = e.touches;
      const dist = Math.hypot(t[1].clientX - t[0].clientX, t[1].clientY - t[0].clientY);
      if (lastDist) {
        const cw = wrap.clientWidth;
        const ch = wrap.clientHeight;
        const cx = (t[0].clientX + t[1].clientX) / 2 - wrap.getBoundingClientRect().left;
        const cy = (t[0].clientY + t[1].clientY) / 2 - wrap.getBoundingClientRect().top;
        // Zoom toward pinch center
        const newScale = scale * dist / lastDist;
        const clamped = Math.max(coverScale, Math.min(6, newScale));
        const ratio = clamped / scale;
        tx = cx - (cx - tx) * ratio;
        ty = cy - (cy - ty) * ratio;
        scale = clamped;
        // Re-init if zoomed out past cover
        const cw2 = wrap.clientWidth;
        const ch2 = wrap.clientHeight;
        const coverS = Math.max(cw2 / imgW, ch2 / imgH);
        if (scale < coverS * 0.95) { reset(); }
        else { clamp(); apply(); }
      }
      lastDist = dist;
    } else if (e.touches.length === 1 && startX !== undefined) {
      e.preventDefault();
      tx = e.touches[0].clientX - startX;
      ty = e.touches[0].clientY - startY;
      clamp();
      apply();
    }
  }, { passive: false });

  wrap.addEventListener('touchend', () => { lastDist = 0; });
  wrap.addEventListener('touchcancel', () => { lastDist = 0; });

  // Double-tap
  let lastTap = 0;
  wrap.addEventListener('touchend', (e) => {
    if (e.changedTouches.length === 1 && e.touches.length === 0) {
      const now = Date.now();
      if (now - lastTap < 300) {
        if (scale > coverScale * 1.5) { reset(); }
        else { zoomTo(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }
      }
      lastTap = now;
    }
  });

  function zoomTo(clientX, clientY) {
    const rect = wrap.getBoundingClientRect();
    const cx = clientX - rect.left;
    const cy = clientY - rect.top;
    const newScale = 3;
    const ratio = newScale / scale;
    tx = cx - (cx - tx) * ratio;
    ty = cy - (cy - ty) * ratio;
    scale = newScale;
    clamp();
    apply();
  }
})();</script>

</body>
